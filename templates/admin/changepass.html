<!DOCTYPE html>
<html>
<head>
    <title>Change Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container mt-4">

    <button class="btn btn-secondary mb-3" onclick="history.back()">← Back</button>

    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4>Change Password</h4>
        </div>

        <div class="card-body">

            <!-- Django Messages -->
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post"
                  action="/myapp/AdminChangePasswordPost/"
                  onsubmit="return validatePassword()">

                {% csrf_token %}

                <div class="mb-3">
                    <label>Current Password</label>
                    <input type="password"
                           name="current_password"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label>New Password</label>
                    <input type="password"
                           name="new_password"
                           id="new_password"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label>Confirm New Password</label>
                    <input type="password"
                           id="confirm_password"
                           class="form-control"
                           required>
                    <small id="error_msg" class="text-danger"></small>
                </div>

                <button type="submit" class="btn btn-success">
                    Change Password
                </button>
            </form>

        </div>
    </div>
</div>

<script>
function validatePassword() {
    let newPass = document.getElementById("new_password").value;
    let confirmPass = document.getElementById("confirm_password").value;
    let error = document.getElementById("error_msg");

    if (newPass.length < 6) {
        error.innerHTML = "Password must be at least 6 characters";
        return false;
    }

    if (newPass !== confirmPass) {
        error.innerHTML = "New password and confirm password must match";
        return false;
    }

    error.innerHTML = "";
    return true;
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
