<html>
<head>
    <title>Cyber Security Admin Panel</title>
    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        th {
            background-color: #1f2937;
            color: white;
            padding: 12px;
            text-align: left;
            font-size: 16px;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
        }

        tr:hover td {
            background-color: #f0f4f8;
        }

        table, th, td {
            border: 1px solid #ccc;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 16px;
            font-size: 0.9rem;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: 0.3s;
        }
          .delete-btn {
            display: inline-flex;
            align-items: center;text-decoration: none;
            gap: 8px;
            background: #f81c00;
            color: white;
            border: none;
            padding: 10px 16px;
            font-size: 0.9rem;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #2c81ba;
        }
    </style>
</head>
      <!-- ★ BACK BUTTON ADDED -->
        <button class="back-btn" onclick="history.back()">
            <i class="fas fa-arrow-left"></i> Back
        </button>
<body>

    <h1>Cyber Security Admin Panel</h1>

    <table cellpadding="10" cellspacing="5">
        <tr>
            <th>SL NO</th>
            <th>Date</th>
            <th>User details</th>
            <th>Comments</th>
            <th>Post</th>
            <th>Type</th>
            <th>Action</th>
        </tr>
        {% for i in data %}

        <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ i.date }}</td>
            <td>Name :{{ i.USER.name }}<br>Email : {{ i.USER.email }}


            </td>
            <td>{{ i.comment }}</td>
            <td>
                <img src="{{ i.post.image.url }}" height="100" width="100">
                {{ i.post.description }}
            </td>
            <td>{{ i.type }}</td>
            <td><a href="/myapp/Delete_bulling_comment/{{ i.id }}" class="delete-btn">Delete</a> </td>
        </tr>
        {% endfor %}

    </table>

</body>
</html>
