<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Reply</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #3498db, #2c3e50);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
            font-weight: 300;
        }

        .form-container {
            padding: 40px;
        }

        .complaint-info {
            background: #f8f9fa;
            border-left: 4px solid #3498db;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 30px;
        }

        .complaint-info h3 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .complaint-info h3 i {
            color: #3498db;
        }

        .complaint-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .detail-label {
            font-size: 13px;
            color: #7f8c8d;
            font-weight: 500;
        }

        .detail-value {
            font-size: 15px;
            color: #2c3e50;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-size: 16px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 12px;
        }

        textarea {
            width: 100%;
            padding: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            resize: vertical;
            transition: border-color 0.3s, box-shadow 0.3s;
            min-height: 150px;
        }

        textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        .char-count {
            text-align: right;
            font-size: 14px;
            color: #7f8c8d;
            margin-top: 8px;
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        input[type="submit"] {
            background: linear-gradient(to right, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
        }

        input[type="submit"]:hover {
            background: linear-gradient(to right, #2980b9, #2573a7);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(52, 152, 219, 0.4);
        }

        .back-link {
            background: #f8f9fa;
            color: #2c3e50;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            border: 1px solid #ddd;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-link:hover {
            background: #e9ecef;
            border-color: #3498db;
            color: #3498db;
        }

        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            .form-container {
                padding: 25px;
            }

            .header {
                padding: 25px 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .form-actions {
                flex-direction: column;
                gap: 20px;
                align-items: stretch;
            }

            input[type="submit"], .back-link {
                width: 100%;
                text-align: center;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .form-container {
                padding: 20px;
            }

            .header {
                padding: 20px 15px;
            }

            .complaint-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Send Reply to Complaint</h1>
            <p>Compose and send your response to the user's complaint</p>
        </div>

        <div class="form-container">
            <div class="complaint-info">
                <h3><i class="fas fa-exclamation-circle"></i> Complaint Details</h3>
                <div class="complaint-details">
                    <div class="detail-item">
                        <span class="detail-label">Complaint ID:</span>
                        <span class="detail-value">{{ data.id }}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Submitted Date:</span>
                        <span class="detail-value">{{ data.Date }}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">User:</span>
                        <span class="detail-value">{{ data.USER.name }}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Status:</span>
                        <span class="detail-value">{{ data.status }}</span>
                    </div>
                </div>
            </div>

            <form  method="post">
                <div class="form-group">
                    <label for="reply">Your Reply:</label>
                    <textarea id="reply" name="reply" rows="4" cols="50" placeholder="Type your response to the user here..."></textarea>
                    <div class="char-count">Maximum 2000 characters</div>
                </div>

                <div class="form-actions">
                    <input type="submit" value="Send Reply">
                    <a href="" class="back-link"><i class="fas fa-arrow-left"></i> Back to Complaints</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
