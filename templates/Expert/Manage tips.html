<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Tips</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">

    <!-- Back Button -->
    <button class="btn btn-secondary mb-3" onclick="history.back()">
        ← Back
    </button>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Manage Tips</h3>

        <!-- Add Tip Button -->
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addTipModal">
            + Add Tip
        </button>
    </div>

    <!-- Tips Table -->
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Tip</th>
                <th>Details</th>
                <th>Date</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
        {% for i in data %}
            <tr>
                <td>{{ forloop.counter }}</td>
                <td>{{ i.tip }}</td>
                <td>{{ i.details }}</td>
                <td>{{ i.date }}</td>
                <td>
                    <!-- Edit -->
                    <button class="btn btn-warning btn-sm"
                            data-bs-toggle="modal"
                            data-bs-target="#editModal{{ i.id }}">
                        Edit
                    </button>

                    <!-- Delete -->
                    <a href="/myapp/DeleteTip/{{ i.id }}/"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Are you sure?')">
                        Delete
                    </a>
                </td>
            </tr>

            <!-- Edit Modal -->
            <div class="modal fade" id="editModal{{ i.id }}" tabindex="-1">
                <div class="modal-dialog">
                    <form method="post" action="/myapp/EditTip/{{ i.id }}/">
                        {% csrf_token %}
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">Edit Tip</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>

                            <div class="modal-body">
                                <div class="mb-3">
                                    <label class="form-label">Tip</label>
                                    <input type="text" name="tip" value="{{ i.tip }}" class="form-control" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Details</label>
                                    <textarea name="details" class="form-control" required>{{ i.details }}</textarea>
                                </div>
                            </div>

                            <div class="modal-footer">
                                <button type="submit" class="btn btn-success">Update</button>
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        {% empty %}
            <tr>
                <td colspan="5" class="text-center">No tips added yet</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>

<!-- Add Tip Modal -->
<div class="modal fade" id="addTipModal" tabindex="-1">
    <div class="modal-dialog">
        <form method="post" action="/myapp/ManageTips/">
            {% csrf_token %}
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Tip</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Tip</label>
                        <input type="text" name="tip" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Details</label>
                        <textarea name="details" class="form-control" required></textarea>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
