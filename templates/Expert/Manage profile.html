<!DOCTYPE html>
<html>
<head>
    <title>Manage Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container mt-4">

    <!-- Back Button -->
    <button class="btn btn-secondary mb-3" onclick="history.back()">← Back</button>

    <!-- Profile Card -->
    <div class="card shadow">
        <div class="card-header bg-primary text-white d-flex justify-content-between">
            <h4>My Profile</h4>
            <button class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#editProfileModal">
                Edit Profile
            </button>
        </div>

        <div class="card-body">
            <div class="row">
                <div class="col-md-4 text-center">
                    <img src="{{ data.photo.url }}" class="img-thumbnail mb-3" width="180">
                </div>

                <div class="col-md-8">
                    <table class="table table-borderless">
                        <tr>
                            <th>Name</th>
                            <td>{{ data.name }}</td>
                        </tr>
                        <tr>
                            <th>Email</th>
                            <td>{{ data.email }}</td>
                        </tr>
                        <tr>
                            <th>Phone</th>
                            <td>{{ data.phone }}</td>
                        </tr>
                        <tr>
                            <th>DOB</th>
                            <td>{{ data.DOB }}</td>
                        </tr>
                        <tr>
                            <th>Gender</th>
                            <td>{{ data.gender }}</td>
                        </tr>
                        <tr>
                            <th>Place</th>
                            <td>{{ data.place }}</td>
                        </tr>
                        <tr>
                            <th>Status</th>
                            <td>
                                <span class="badge bg-info">{{ data.status }}</span>
                            </td>
                        </tr>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Edit Profile Modal -->
<div class="modal fade" id="editProfileModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <form method="post" action="/myapp/edit_profile/" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Profile</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label>Name</label>
                            <input type="text" name="name" value="{{ data.name }}" class="form-control" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>Email</label>
                            <input type="email" name="email" value="{{ data.email }}" class="form-control" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>Phone</label>
                            <input type="text" name="phone" value="{{ data.phone }}" class="form-control" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>DOB</label>
                            <input type="date" name="DOB"
                                   value="{{ data.DOB|date:'Y-m-d' }}"
                                   class="form-control">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>Gender</label>
                            <select name="gender" class="form-control">
                                <option value="Male" {% if data.gender == 'Male' %}selected{% endif %}>Male</option>
                                <option value="Female" {% if data.gender == 'Female' %}selected{% endif %}>Female</option>
                                <option value="Other" {% if data.gender == 'Other' %}selected{% endif %}>Other</option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>Place</label>
                            <input type="text" name="place" value="{{ data.place }}" class="form-control">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>Photo</label><br>
                            <img src="{{ data.photo.url }}" width="80" class="mb-2 rounded"><br>
                            <input type="file" name="photo" class="form-control">
                        </div>

                    </div>
                </div>

                <div class="modal-footer">
                    <button type="submit" class="btn btn-success">Update</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                </div>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
