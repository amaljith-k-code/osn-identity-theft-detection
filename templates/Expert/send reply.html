<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reply</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        table {
            margin: 0 auto;
            width: 50%;
            background: white;
            border-collapse: collapse;
            border: 1px solid #ccc;
        }

        td {
            padding: 15px;
            border: 1px solid #ccc;
            background: #fff;
        }

        input[type="text"] {
            width: 98%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input[type="submit"] {
            background: #333;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        input[type="submit"]:hover {
            background: #555;
        }
    </style>
</head>

<body>

    <h1>Send Reply</h1>

    <form method="post">
        <table>
            <tr>
                <td><strong>Reply:</strong></td>
                <td><input type="text" name="reply" required></td>
            </tr>

            <tr>
                <td colspan="2" style="text-align: center;">
                    <input type="submit" value="Send Reply">
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
