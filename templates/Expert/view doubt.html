<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Doubt</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        table {
            width: 80%;
            margin: 0 auto;
            border-collapse: collapse;
            background: #fff;
            border: 1px solid #ccc;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ccc;
            text-align: center;
        }

        th {
            background: #333;
            color: white;
            font-weight: 600;
        }

        a {
            text-decoration: none;
            color: #0066cc;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>

</head>
<body>

    <h1>View Doubt</h1>

    <table>
        <tr>
            <th>Username</th>
            <th>Doubt</th>
            <th>Date</th>
            <th>Reply</th>
        </tr>

        {% for i in data %}
        <tr>
            <td>{{ i.USER.name }}</td>
            <td>{{ i.doubt }}</td>
            <td>{{ i.date }}</td>
            {% if i.reply == "pending" %}
                <td><a href="/myapp/send_reply/{{ i.id }}">Reply</a></td>
            {% else %}
                <td>{{ i.reply }}</td>
            {% endif %}
        </tr>
        {% endfor %}
    </table>

</body>
</html>
